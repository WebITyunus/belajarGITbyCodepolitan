<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Page</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px 0;
    }
    
    .register-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      max-width: 550px;
      width: 100%;
    }
    
    .register-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 35px 30px;
      text-align: center;
      color: white;
    }
    
    .register-header .avatar {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 40px;
    }
    
    .register-body {
      padding: 40px 30px;
      background: white;
    }
    
    .form-floating > .form-control {
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      height: 55px;
    }
    
    .form-floating > .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    
    .form-floating > label {
      padding: 1rem 0.75rem;
      color: #888;
    }
    
    .btn-register {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      color: white;
      width: 100%;
    }
    
    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
      color: white;
    }
    
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #999;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .divider span {
      padding: 0 15px;
      font-size: 14px;
    }
    
    .social-btn {
      border-radius: 10px;
      padding: 10px;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .social-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .form-check-input:checked {
      background-color: #667eea;
      border-color: #667eea;
    }
    
    a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    
    a:hover {
      color: #764ba2;
    }
    
    /* Password Strength Indicator */
    .password-strength {
      height: 5px;
      border-radius: 5px;
      margin-top: 8px;
      background-color: #e0e0e0;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    
    .password-strength-bar {
      height: 100%;
      width: 0;
      transition: all 0.3s ease;
      border-radius: 5px;
    }
    
    .strength-weak { background-color: #dc3545; width: 33%; }
    .strength-medium { background-color: #ffc107; width: 66%; }
    .strength-strong { background-color: #28a745; width: 100%; }
    
    .strength-text {
      font-size: 12px;
      margin-top: 5px;
      font-weight: 500;
    }
    
    /* Progress step */
    .progress-steps {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 25px;
    }
    
    .step-dot {
      width: 40px;
      height: 4px;
      border-radius: 4px;
      background: #e0e0e0;
    }
    
    .step-dot.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="register-card mx-auto">
      
      <!-- Header -->
      <div class="register-header">
        <div class="avatar">
          <i class="bi bi-person-plus-fill"></i>
        </div>
        <h3 class="mb-1 fw-bold">Buat Akun Baru</h3>
        <p class="mb-0 opacity-75">Daftar sekarang dan mulai perjalanan Anda</p>
      </div>
      
      <!-- Body -->
      <div class="register-body">
        
        <!-- Progress Steps -->
        <div class="progress-steps">
          <div class="step-dot active"></div>
          <div class="step-dot active"></div>
          <div class="step-dot"></div>
        </div>
        
        <form action="#" method="POST" id="registerForm">
          
          <!-- Nama Lengkap -->
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="fullname" placeholder="Nama Lengkap" required>
            <label for="fullname"><i class="bi bi-person me-2"></i>Nama Lengkap</label>
          </div>
          
          <!-- Username -->
          <div class="form-floating mb-3">
            <input type="text" class="form-control" id="username" placeholder="Username" required>
            <label for="username"><i class="bi bi-at me-2"></i>Username</label>
          </div>
          
          <!-- Email -->
          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            <label for="email"><i class="bi bi-envelope me-2"></i>Email</label>
          </div>
          
          <!-- Nomor Telepon -->
          <div class="form-floating mb-3">
            <input type="tel" class="form-control" id="phone" placeholder="08123456789" required>
            <label for="phone"><i class="bi bi-telephone me-2"></i>Nomor Telepon</label>
          </div>
          
          <!-- Password -->
          <div class="form-floating mb-2 position-relative">
            <input type="password" class="form-control" id="password" placeholder="Password" 
                   oninput="checkPasswordStrength()" required>
            <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
            <button type="button" class="btn position-absolute top-0 end-0 mt-2 me-2 border-0" 
                    onclick="togglePassword('password', 'toggleIcon1')" style="z-index: 10;">
              <i class="bi bi-eye-slash" id="toggleIcon1"></i>
            </button>
          </div>
          
          <!-- Password Strength -->
          <div class="password-strength mb-1">
            <div class="password-strength-bar" id="strengthBar"></div>
          </div>
          <div class="strength-text mb-3" id="strengthText"></div>
          
          <!-- Konfirmasi Password -->
          <div class="form-floating mb-3 position-relative">
            <input type="password" class="form-control" id="confirmPassword" placeholder="Konfirmasi Password" required>
            <label for="confirmPassword"><i class="bi bi-lock-fill me-2"></i>Konfirmasi Password</label>
            <button type="button" class="btn position-absolute top-0 end-0 mt-2 me-2 border-0" 
                    onclick="togglePassword('confirmPassword', 'toggleIcon2')" style="z-index: 10;">
              <i class="bi bi-eye-slash" id="toggleIcon2"></i>
            </button>
          </div>
          
          <!-- Terms & Conditions -->
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="terms" required>
            <label class="form-check-label" for="terms">
              Saya setuju dengan <a href="#">Syarat & Ketentuan</a> dan <a href="#">Kebijakan Privasi</a>
            </label>
          </div>
          
          <!-- Button Register -->
          <button type="submit" class="btn btn-register mb-3">
            <i class="bi bi-person-plus me-2"></i>Daftar Sekarang
          </button>
          
          <!-- Divider -->
          <div class="divider">
            <span>atau daftar dengan</span>
          </div>
          
          <!-- Social Register -->
          <div class="row g-2 mb-4">
            <div class="col-6">
              <button type="button" class="btn btn-outline-danger social-btn w-100">
                <i class="bi bi-google me-2"></i>Google
              </button>
            </div>
            <div class="col-6">
              <button type="button" class="btn btn-outline-primary social-btn w-100">
                <i class="bi bi-facebook me-2"></i>Facebook
              </button>
            </div>
          </div>
          
          <!-- Login Link -->
          <p class="text-center mb-0">
            Sudah punya akun? <a href="login.html">Login di sini</a>
          </p>
          
        </form>
      </div>
      
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // Toggle Password Visibility
    function togglePassword(inputId, iconId) {
      const passwordInput = document.getElementById(inputId);
      const toggleIcon = document.getElementById(iconId);
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('bi-eye-slash');
        toggleIcon.classList.add('bi-eye');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('bi-eye');
        toggleIcon.classList.add('bi-eye-slash');
      }
    }
    
    // Check Password Strength
    function checkPasswordStrength() {
      const password = document.getElementById('password').value;
      const strengthBar = document.getElementById('strengthBar');
      const strengthText = document.getElementById('strengthText');
      
      let strength = 0;
      
      // Check length
      if (password.length >= 8) strength++;
      // Check lowercase & uppercase
      if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
      // Check number
      if (/\d/.test(password)) strength++;
      // Check special character
      if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;
      
      // Reset classes
      strengthBar.className = 'password-strength-bar';
      strengthText.className = 'strength-text';
      
      if (password.length === 0) {
        strengthText.textContent = '';
        return;
      }
      
      if (strength <= 1) {
        strengthBar.classList.add('strength-weak');
        strengthText.classList.add('text-danger');
        strengthText.textContent = 'Password lemah';
      } else if (strength <= 3) {
        strengthBar.classList.add('strength-medium');
        strengthText.classList.add('text-warning');
        strengthText.textContent = 'Password sedang';
      } else {
        strengthBar.classList.add('strength-strong');
        strengthText.classList.add('text-success');
        strengthText.textContent = 'Password kuat';
      }
    }
    
    // Form Validation
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      
      if (password !== confirmPassword) {
        e.preventDefault();
        alert('Password dan Konfirmasi Password tidak sama!');
        return false;
      }
      
      if (password.length < 8) {
        e.preventDefault();
        alert('Password minimal 8 karakter!');
        return false;
      }
      
      alert('Registrasi berhasil! (Demo)');
    });
  </script>

</body>
</html>
