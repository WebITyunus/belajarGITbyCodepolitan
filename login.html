<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .login-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      max-width: 450px;
      width: 100%;
    }
    
    .login-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 40px 30px;
      text-align: center;
      color: white;
    }
    
    .login-header .avatar {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 40px;
    }
    
    .login-body {
      padding: 40px 30px;
      background: white;
    }
    
    .form-floating > .form-control {
      border-radius: 10px;
      border: 1px solid #e0e0e0;
      height: 55px;
    }
    
    .form-floating > .form-control:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
    }
    
    .form-floating > label {
      padding: 1rem 0.75rem;
      color: #888;
    }
    
    .input-group-text {
      background: transparent;
      border-right: none;
      border-radius: 10px 0 0 10px;
    }
    
    .btn-login {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      color: white;
      width: 100%;
    }
    
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
      color: white;
    }
    
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #999;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .divider span {
      padding: 0 15px;
      font-size: 14px;
    }
    
    .social-btn {
      border-radius: 10px;
      padding: 10px;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .social-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }
    
    .form-check-input:checked {
      background-color: #667eea;
      border-color: #667eea;
    }
    
    a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }
    
    a:hover {
      color: #764ba2;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <div class="login-card mx-auto">
      
      <!-- Header -->
      <div class="login-header">
        <div class="avatar">
          <i class="bi bi-person-fill"></i>
        </div>
        <h3 class="mb-1 fw-bold">Selamat Datang</h3>
        <p class="mb-0 opacity-75">Silakan login untuk melanjutkan</p>
      </div>
      
      <!-- Body -->
      <div class="login-body">
        <form action="#" method="POST">
          
          <!-- Email -->
          <div class="form-floating mb-3">
            <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            <label for="email"><i class="bi bi-envelope me-2"></i>Email</label>
          </div>
          
          <!-- Password -->
          <div class="form-floating mb-3 position-relative">
            <input type="password" class="form-control" id="password" placeholder="Password" required>
            <label for="password"><i class="bi bi-lock me-2"></i>Password</label>
            <button type="button" class="btn position-absolute top-50 end-0 translate-middle-y me-2 border-0" 
                    onclick="togglePassword()" style="z-index: 10;">
              <i class="bi bi-eye-slash" id="toggleIcon"></i>
            </button>
          </div>
          
          <!-- Remember & Forgot -->
          <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember">
              <label class="form-check-label" for="remember">
                Ingat saya
              </label>
            </div>
            <a href="#">Lupa password?</a>
          </div>
          
          <!-- Button Login -->
          <button type="submit" class="btn btn-login mb-3">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login
          </button>
          
          <!-- Divider -->
          <div class="divider">
            <span>atau login dengan</span>
          </div>
          
          <!-- Social Login -->
          <div class="row g-2 mb-4">
            <div class="col-6">
              <button type="button" class="btn btn-outline-danger social-btn w-100">
                <i class="bi bi-google me-2"></i>Google
              </button>
            </div>
            <div class="col-6">
              <button type="button" class="btn btn-outline-primary social-btn w-100">
                <i class="bi bi-facebook me-2"></i>Facebook
              </button>
            </div>
          </div>
          
          <!-- Register Link -->
          <p class="text-center mb-0">
            Belum punya akun? <a href="#">Daftar sekarang</a>
          </p>
          
        </form>
      </div>
      
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('bi-eye-slash');
        toggleIcon.classList.add('bi-eye');
      } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('bi-eye');
        toggleIcon.classList.add('bi-eye-slash');
      }
    }
  </script>

</body>
</html>
